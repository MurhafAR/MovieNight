# PostgreSQL database for MovieNight
# Start with: docker compose up -d
# The dev script references "docker start movienight-db" assuming this container exists
version: "3.8"

services:
  db:
    image: postgres:16
    container_name: movienight-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Coiniscool100$$
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
